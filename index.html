<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEG/ROTEM Interpretation Practice</title>
<style>
  :root { --bg:#0b0c10; --panel:#12141b; --ink:#e7ebf2; --muted:#98a2b3; --accent:#67e8f9; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .header{display:flex;justify-content:space-between;align-items:center;background:#0f1117;border:1px solid #1f2531;border-radius:16px;padding:14px 16px}
  h1{font-size:18px;margin:0}
  .score{font-weight:700}
  .card{background:var(--panel);border:1px solid #1f2531;border-radius:16px;padding:16px}
  .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  .muted{color:var(--muted)}
  .title{font-weight:800;font-size:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;cursor:pointer;border-radius:12px;padding:10px 12px;border:1px solid #2b3446;background:#0f1320;color:var(--ink)}
  .btn:hover{border-color:#3a4a61}
  .btn.primary{background:#1b2437;border-color:#32415a}
  .btn.selected{background:var(--accent);color:#0a0f12;border-color:var(--accent)}
  .choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  img.trace{display:block;width:100%;height:auto;background:transparent;border-radius:12px;border:1px solid #2a3140}
  .params{margin-top:8px;border-top:1px dashed #2a3140;padding-top:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:6px 8px;border-bottom:1px solid #212838;text-align:left}
  .pill{background:#16212f;border:1px solid #273143;color:var(--muted);padding:4px 8px;border-radius:999px;font-size:12px}
  .result{margin-top:10px;padding:12px;border-radius:12px;background:#0d2019;border:1px solid #1a3b2f;color:#bfffe1}
  .result.bad{background:#2a1717;border:1px solid #4d2323;color:#ffd5d5}
  .error{margin-top:10px;padding:10px;border-radius:10px;background:#2a1717;border:1px solid #4d2323;color:#ffd5d5}
  .done{padding:16px;border-radius:14px;background:#11221a;border:1px solid #1f3c2e}
  @media (max-width:920px){ .grid{grid-template-columns:1fr} .choices{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>TEG/ROTEM Interpretation Practice</h1>
      <div id="score" class="score">Score: 0/0</div>
    </div>
    <div id="main" style="margin-top:16px"></div>
  </div>

<script>
(function(){
  // helpers
  function $(sel){ return document.querySelector(sel); }
  function el(tag, attrs, html){
    var n = document.createElement(tag);
    if(attrs){ for(var k in attrs){ n.setAttribute(k, attrs[k]); } }
    if(html != null){ n.innerHTML = html; }
    return n;
  }
  function shuffled(a){
    var x=a.slice();
    for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; }
    return x;
  }

  // enums
  var CONDITIONS = [
    "Normal",
    "Anticoagulants / Factor deficiency",
    "Platelet blockers",
    "Fibrinolysis",
    "Hypercoagulable state",
    "DIC (early)",
    "DIC (late)"
  ];
  var THERAPIES = {
    plasma: "Plasma (coag factors)",
    fibrinogen: "Fibrinogen (Cryo/conc)",
    platelets: "Platelets",
    txa: "TXA / antifibrinolytic",
    protamine: "Protamine (heparin)",
    none: "No product"
  };
  var NORMALS = {
    TEG: { R:[5,10], K:[1,3], alpha:[53,72], MA:[50,70], LY30:[0,3] },
    ROTEM: { CT:[38,79], CFT:[34,159], alpha:[65,83], MCF:[50,72], LI30:[94,100] }
  };

  // 14 scenarios
  var CASES = [
    // NORMAL
    { id:"normal-1", svg:"graphs/Normal.svg", condition:"Normal",
      description:"Post-op check: dry field, normothermic, ionized Ca normal.",
      teg:{R:7, K:1.5, alpha:65, MA:62, LY30:1},
      rotem:{CT:70, CFT:120, alpha:70, MCF:62, LI30:98},
      therapies:["none"]
    },
    { id:"normal-2", svg:"graphs/Normal.svg", condition:"Normal",
      description:"Trauma bay re-evaluation after hemostasis.",
      teg:{R:8, K:1.8, alpha:63, MA:60, LY30:2},
      rotem:{CT:75, CFT:140, alpha:68, MCF:60, LI30:97},
      therapies:["none"]
    },

    // ANTICOAGULANTS / FACTOR DEFICIENCY
    { id:"anticoag-1", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"Post-CPB oozing; ACT prolonged; platelets acceptable.",
      teg:{R:16, K:2.5, alpha:58, MA:62, LY30:1},
      rotem:{CT:140, CFT:150, alpha:60, MCF:62, LI30:98},
      therapies:["plasma"]
    },
    { id:"anticoag-2", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"Vascular case with recent heparin dose; anti-Xa elevated.",
      teg:{R:24, K:2, alpha:60, MA:60, LY30:1},
      rotem:{CT:240, CFT:140, alpha:65, MCF:60, LI30:98},
      therapies:["protamine"]
    },

    // PLATELET BLOCKERS
    { id:"plate-1", svg:"graphs/Platelet_blockers.svg", condition:"Platelet blockers",
      description:"On clopidogrel; diffuse oozing; platelets 120k.",
      teg:{R:8, K:2, alpha:55, MA:40, LY30:1},
      rotem:{CT:75, CFT:160, alpha:60, MCF:38, LI30:98},
      therapies:["platelets"]
    },
    { id:"plate-2", svg:"graphs/Platelet_blockers.svg", condition:"Platelet blockers",
      description:"Thrombocytopenia (45k) during liver case; initiation normal.",
      teg:{R:7, K:1.8, alpha:60, MA:36, LY30:2},
      rotem:{CT:70, CFT:150, alpha:62, MCF:34, LI30:97},
      therapies:["platelets"]
    },

    // FIBRINOLYSIS
    { id:"lysis-1", svg:"graphs/fibrinolysis.svg", condition:"Fibrinolysis",
      description:"Polytrauma with early narrowing of trace after peak.",
      teg:{R:8, K:2, alpha:60, MA:62, LY30:14},
      rotem:{CT:70, CFT:140, alpha:65, MCF:62, LI30:60},
      therapies:["txa"]
    },
    { id:"lysis-2", svg:"graphs/fibrinolysis.svg", condition:"Fibrinolysis",
      description:"Major ortho case; recurrent bleeding and increasing lysis.",
      teg:{R:8, K:2, alpha:60, MA:58, LY30:10},
      rotem:{CT:70, CFT:150, alpha:63, MCF:58, LI30:70},
      therapies:["txa"]
    },

    // HYPERCOAGULABLE
    { id:"hyper-1", svg:"graphs/hypercoaguable.svg", condition:"Hypercoagulable state",
      description:"Accelerated clot formation and high amplitude; minimal bleeding.",
      teg:{R:4, K:0.8, alpha:78, MA:74, LY30:1},
      rotem:{CT:45, CFT:60, alpha:80, MCF:72, LI30:98},
      therapies:["none"]
    },
    { id:"hyper-2", svg:"graphs/hypercoaguable.svg", condition:"Hypercoagulable state",
      description:"Thrombophilia workup; fast kinetics, strong clot.",
      teg:{R:5, K:1, alpha:75, MA:70, LY30:1},
      rotem:{CT:50, CFT:80, alpha:78, MCF:68, LI30:99},
      therapies:["none"]
    },

    // DIC (EARLY)
    { id:"dicE-1", svg:"graphs/DIC_early.svg", condition:"DIC (early)",
      description:"Sepsis—rapid formation with lysis component.",
      teg:{R:5, K:1, alpha:72, MA:68, LY30:12},
      rotem:{CT:55, CFT:90, alpha:76, MCF:66, LI30:75},
      therapies:["txa"]
    },
    { id:"dicE-2", svg:"graphs/DIC_early.svg", condition:"DIC (early)",
      description:"Hypercoagulable pattern with early breakdown.",
      teg:{R:6, K:1.2, alpha:70, MA:65, LY30:15},
      rotem:{CT:60, CFT:100, alpha:74, MCF:64, LI30:70},
      therapies:["txa"]
    },

    // DIC (LATE)
    { id:"dicL-1", svg:"graphs/DIC_late.svg", condition:"DIC (late)",
      description:"Severe sepsis—consumption coagulopathy.",
      teg:{R:18, K:5, alpha:35, MA:34, LY30:8},
      rotem:{CT:180, CFT:380, alpha:38, MCF:32, LI30:85},
      therapies:["plasma","fibrinogen","platelets"]
    },
    { id:"dicL-2", svg:"graphs/DIC_late.svg", condition:"DIC (late)",
      description:"End-stage DIC—global failure of clot formation.",
      teg:{R:20, K:6, alpha:30, MA:28, LY30:10},
      rotem:{CT:200, CFT:420, alpha:35, MCF:28, LI30:80},
      therapies:["plasma","fibrinogen","platelets"]
    }
  ];

  // state
  var order = shuffled(CASES.map(function(_,i){ return i; }));
  var ptr = 0;
  var scoreboard = { right:0, total:0 };

  function render(){
    var main = document.getElementById("main");
    if(ptr >= order.length){
      main.innerHTML =
        '<div class="done">' +
          '<h2>All 14 scenarios completed 🎉</h2>' +
          '<p>Final score: <b>' + scoreboard.right + '/' + scoreboard.total + '</b></p>' +
          '<div class="row" style="margin-top:8px">' +
            '<button class="btn" id="restartBtn">Restart (reshuffle)</button>' +
          '</div>' +
        '</div>';
      document.getElementById("restartBtn").onclick = function(){
        order = shuffled(CASES.map(function(_,i){ return i; }));
        ptr = 0; scoreboard.right = 0; scoreboard.total = 0;
        document.getElementById("score").textContent = "Score: 0/0";
        render();
      };
      return;
    }

    var c = CASES[order[ptr]];

    var condButtons = CONDITIONS.map(function(name){
      return '<button class="btn" data-cond="'+name+'">'+name+'</button>';
    }).join('');

    var txButtons = Object.keys(THERAPIES).map(function(k){
      return '<button class="btn" data-tx="'+k+'">'+THERAPIES[k]+'</button>';
    }).join('');

    main.innerHTML =
      '<div class="grid">' +
        '<div class="card">' +
          '<div class="row" style="justify-content:space-between">' +
            '<div>' +
              '<div class="muted" style="text-transform:uppercase;font-size:12px">Case</div>' +
              '<div class="title">' + c.condition + '</div>' +
              '<div class="muted" style="margin-top:2px">' + c.description + '</div>' +
            '</div>' +
            '<div class="row"><span class="pill">Progress ' + (ptr+1) + '/14</span></div>' +
          '</div>' +

          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-top:12px">' +
            '<div>' +
              '<div class="muted" style="text-transform:uppercase;font-size:12px;margin-bottom:6px">Trace (SVG)</div>' +
              '<img id="trace" class="trace" alt="trace" src="' + c.svg + '">' +
              '<div id="imgErr" class="error" style="display:none"></div>' +
            '</div>' +

            '<div>' +
              '<div class="row"><button id="toggleParams" class="btn">Show parameters</button></div>' +
              '<div id="params" class="params" style="display:none">' +
                '<div class="muted" style="margin-bottom:6px">TEG (min/deg/mm, %)</div>' +
                '<table>' +
                  '<tr><th>R</th><th>K</th><th>α</th><th>MA</th><th>LY30</th></tr>' +
                  '<tr><td>'+c.teg.R+'</td><td>'+c.teg.K+'</td><td>'+c.teg.alpha+'</td><td>'+c.teg.MA+'</td><td>'+c.teg.LY30+'</td></tr>' +
                '</table>' +
                '<div class="muted" style="margin:8px 0 6px">ROTEM (s/deg/mm, %)</div>' +
                '<table>' +
                  '<tr><th>CT</th><th>CFT</th><th>α</th><th>MCF</th><th>LI30</th></tr>' +
                  '<tr><td>'+c.rotem.CT+'</td><td>'+c.rotem.CFT+'</td><td>'+c.rotem.alpha+'</td><td>'+c.rotem.MCF+'</td><td>'+c.rotem.LI30+'</td></tr>' +
                '</table>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div style="margin-top:12px">' +
            '<div class="muted" style="text-transform:uppercase;font-size:12px;margin-bottom:6px">1) Which condition?</div>' +
            '<div class="choices" id="condChoices">' + condButtons + '</div>' +

            '<div class="muted" style="text-transform:uppercase;font-size:12px;margin:12px 0 6px">2) Select treatment(s)</div>' +
            '<div class="choices" id="txChoices">' + txButtons + '</div>' +

            '<div class="row" style="margin-top:10px">' +
              '<button id="checkBtn" class="btn">Check</button>' +
              '<button id="nextBtn" class="btn primary">Next</button>' +
            '</div>' +

            '<div id="result" class="result" style="display:none"></div>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="row" style="justify-content:space-between">' +
            '<div style="font-weight:700">Reference & Notes</div>' +
            '<button id="toggleNotes" class="btn">Show</button>' +
          '</div>' +
          '<div id="notesBox" style="display:none;margin-top:8px">' +
            '<div style="font-weight:700;margin:6px 0 4px">Normal values (simplified)</div>' +
            '<table style="margin-bottom:8px">' +
              '<tr><th colspan="5" style="text-align:left">TEG</th></tr>' +
              '<tr><th>R (min)</th><th>K (min)</th><th>α (deg)</th><th>MA (mm)</th><th>LY30 (%)</th></tr>' +
              '<tr>' +
                '<td>'+NORMALS.TEG.R[0]+'–'+NORMALS.TEG.R[1]+'</td>' +
                '<td>'+NORMALS.TEG.K[0]+'–'+NORMALS.TEG.K[1]+'</td>' +
                '<td>'+NORMALS.TEG.alpha[0]+'–'+NORMALS.TEG.alpha[1]+'</td>' +
                '<td>'+NORMALS.TEG.MA[0]+'–'+NORMALS.TEG.MA[1]+'</td>' +
                '<td>'+NORMALS.TEG.LY30[0]+'–'+NORMALS.TEG.LY30[1]+'</td>' +
              '</tr>' +
            '</table>' +
            '<table>' +
              '<tr><th colspan="5" style="text-align:left">ROTEM</th></tr>' +
              '<tr><th>CT (s)</th><th>CFT (s)</th><th>α (deg)</th><th>MCF (mm)</th><th>LI30 (%)</th></tr>' +
              '<tr>' +
                '<td>'+NORMALS.ROTEM.CT[0]+'–'+NORMALS.ROTEM.CT[1]+'</td>' +
                '<td>'+NORMALS.ROTEM.CFT[0]+'–'+NORMALS.ROTEM.CFT[1]+'</td>' +
                '<td>'+NORMALS.ROTEM.alpha[0]+'–'+NORMALS.ROTEM.alpha[1]+'</td>' +
                '<td>'+NORMALS.ROTEM.MCF[0]+'–'+NORMALS.ROTEM.MCF[1]+'</td>' +
                '<td>'+NORMALS.ROTEM.LI30[0]+'–'+NORMALS.ROTEM.LI30[1]+'</td>' +
              '</tr>' +
            '</table>' +
            '<ul class="muted" style="margin:10px 0 0 18px;line-height:1.4">' +
              '<li><b>R/CT ↑</b> → Plasma (consider protamine if heparin).</li>' +
              '<li><b>K/CFT ↑ or α ↓</b> → Fibrinogen (cryo/conc).</li>' +
              '<li><b>MA/MCF ↓</b> → Platelets.</li>' +
              '<li><b>LY30 ↑ / LI30 ↓</b> → Antifibrinolytic (TXA) if appropriate.</li>' +
            '</ul>' +
            '<div class="muted" style="margin-top:10px;font-size:12px">Educational tool only; not for clinical use.</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    // image error
    var img = document.getElementById("trace");
    img.onerror = function(){
      var e = document.getElementById("imgErr");
      e.style.display = "block";
      e.textContent = "Could not load " + c.svg + ". Check filename and graphs/ folder.";
    };

    // toggles
    document.getElementById("toggleParams").onclick = function(){
      var pane = document.getElementById("params");
      var open = pane.style.display !== "none";
      pane.style.display = open ? "none" : "block";
      this.textContent = open ? "Show parameters" : "Hide parameters";
    };
    document.getElementById("toggleNotes").onclick = function(){
      var box = document.getElementById("notesBox");
      var open = box.style.display !== "none";
      box.style.display = open ? "none" : "block";
      this.textContent = open ? "Show" : "Hide";
    };

    // single-select condition
    Array.prototype.forEach.call(document.getElementById("condChoices").children, function(btn){
      btn.addEventListener("click", function(){
        Array.prototype.forEach.call(document.getElementById("condChoices").children, function(b){ b.classList.remove("selected"); });
        btn.classList.add("selected");
      });
    });

    // multi-select therapies
    Array.prototype.forEach.call(document.getElementById("txChoices").children, function(btn){
      btn.addEventListener("click", function(){ btn.classList.toggle("selected"); });
    });

    document.getElementById("checkBtn").onclick = function(){ check(c); };
    document.getElementById("nextBtn").onclick = function(){ ptr++; render(); };
  }

  function check(c){
    var chosenCondBtn = document.querySelector('#condChoices .btn.selected');
    var chosenCond = chosenCondBtn ? chosenCondBtn.getAttribute('data-cond') : null;
    var chosenTx = Array.prototype.map.call(
      document.querySelectorAll('#txChoices .btn.selected'),
      function(b){ return b.getAttribute('data-tx'); }
    ).sort();

    var requiredTx = c.therapies.slice().sort();
    var condOK = (chosenCond === c.condition);
    var txOK = JSON.stringify(chosenTx) === JSON.stringify(requiredTx);

    // score
    var sEl = document.getElementById("score");
    var t = sEl.textContent.match(/(\d+)\/(\d+)/);
    var r = t ? {right:parseInt(t[1],10), total:parseInt(t[2],10)} : {right:0,total:0};
    r.total += 1; if(condOK && txOK) r.right += 1;
    sEl.textContent = "Score: " + r.right + "/" + r.total;

    var box = document.getElementById("result");
    box.style.display = "block";
    box.className = "result " + (condOK && txOK ? "" : "bad");
    box.innerHTML =
      "<div><b>Condition:</b> " + (condOK ? "✅ correct" : "❌ expected “" + c.condition + "”") + "</div>" +
      "<div><b>Treatment:</b> " + (txOK ? "✅ correct" : "❌ expected " + c.therapies.map(function(k){return THERAPIES[k];}).join(", ")) + "</div>";
  }

  // boot
  document.addEventListener("DOMContentLoaded", function(){
    render();
  });
})();
</script>
</body>
</html>
