<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viscoelastic Testing Practice</title>
<style>
  :root {
    --bg:#F5F2EF;
    --panel:#ffffff;
    --ink:#202020;
    --muted:#5a5a5a;
    --accent:#c22d2d;
    --accent-2:#0c7d73;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial
  }
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .header{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel);border:1px solid #e3e3e3;border-radius:16px;
    padding:14px 18px;box-shadow:0 2px 6px rgba(0,0,0,.05)
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{height:100px;width:auto;display:block}
  h1{font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .score{font-weight:700;color:var(--accent-2)}
  @media (max-width:920px){ .logo{height:80px} }
  .card{
    background:var(--panel);border:1px solid #e6e6e6;border-radius:16px;
    padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)
  }
  .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  .muted{color:var(--muted)}
  .title{font-weight:800;font-size:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{
    appearance:none;cursor:pointer;border-radius:12px;padding:10px 12px;
    border:1px solid #cfcfcf;background:#f7f7f7;color:var(--ink);
    transition:background .2s,border-color .2s,transform .02s
  }
  .btn:hover{background:#efefef;border-color:#bdbdbd}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.selected{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .trace-wrap{background:#ffffff;border-radius:12px;border:1px solid #dadada;padding:8px}
  img.trace{display:block;width:100%;height:auto;background:#ffffff;border-radius:8px}

  /* --- Re-entry animation so repeated SVGs still "change" --- */
  @keyframes trace-reenter {
    0%   { opacity: 0; transform: scale(.985); }
    60%  { opacity: 0; }
    100% { opacity: 1; transform: scale(1); }
  }
  .trace { opacity: 0; }                /* hidden until we animate */
  .trace.show { animation: trace-reenter .28s ease-out forwards; }

  /* Respect users who prefer reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .trace.show { animation: none; opacity: 1; }
  }

  .params{margin-top:8px;border-top:1px dashed #d6d6d6;padding-top:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:6px 8px;border-bottom:1px solid #e7e7e7;text-align:left}
  .pill{background:#f1f1f1;border:1px solid #dfdfdf;color:var(--muted);padding:4px 8px;border-radius:999px;font-size:12px}
  .result{margin-top:10px;padding:12px;border-radius:12px;background:#e8f6ee;border:1px solid #b6e0c1;color:#2b5e36}
  .result.bad{background:#fae9e9;border:1px solid #d38c8c;color:#902b2b}
  .error{margin-top:10px;padding:10px;border-radius:10px;background:#fae9e9;border:1px solid #d38c8c;color:#902b2b}
  .done{padding:16px;border-radius:14px;background:#eef6f4;border:1px solid #d5e7e3}
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <img src="graphs/logo.png" alt="Viscoelastic Testing Practice logo" class="logo">
        <h1>Viscoelastic Testing Practice</h1>
      </div>
      <div id="score" class="score">Score: 0/0</div>
    </div>
    <div id="main" style="margin-top:16px"></div>
  </div>

<script>

    },
    { id:"anticoag-1", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"After cardiothoracic surgery, mild oozing persists from multiple small sites. The patient has been rewarmed and electrolytes corrected. Anesthetic recovery is uneventful, but clinicians obtain a viscoelastic trace to assess early clot initiation and kinetics before giving additional products.",
      teg:{R:16, K:2.5, alpha:58, MA:62, LY30:1},

      therapies:["factor"]
    },
    { id:"anticoag-3", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"A patient with liver disease develops diffuse bleeding following abdominal surgery. Bleeding is not brisk but persists despite surgical hemostasis. A viscoelastic analysis is ordered.",
      teg:{R:18, K:2.2, alpha:56, MA:60, LY30:1},

    },
    { id:"fibrino-1", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"In a major abdominal procedure with moderate transfusion requirement, the operative field shows slow ooze from broad tissue planes. Core temperature and acid–base status are acceptable. A viscoelastic study is performed to examine clot propagation and firmness.",
      teg:{R:8, K:3.5, alpha:48, MA:56, LY30:2},
      rotem:{CT:80, CFT:260, alpha:54, MCF:54, LI30:97},
      therapies:["factor"]
    },
    { id:"fibrino-2", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"A postpartum hemorrhage has been controlled surgically, but small diffuse bleeding continues. Blood pressure and temperature are stable. Clinicians request a viscoelastic test to evaluate the quality of hemostasis.",
      teg:{R:7, K:3.2, alpha:50, MA:52, LY30:1},

    },
    { id:"plate-1", svg:"graphs/Platelet_blockers.svg", condition:"Abnormal platelet function / antiplatelet agent",

    },

      rotem:{CT:70, CFT:150, alpha:62, MCF:34, LI30:97},
      therapies:["platelets"]
    },
    { id:"lysis-1", svg:"graphs/fibrinolysis.svg", condition:"Fibrinolysis",
      description:"Following initial control of major trauma bleeding, re-accumulation of blood occurs at line sites and drains. Laboratory studies are pending. A viscoelastic test is requested.",

    /* ===== 17 NEW CASES START ===== */

      teg:{R:16, K:2.8, alpha:55, MA:58, LY30:1},
      rotem:{CT:145, CFT:180, alpha:58, MCF:58, LI30:98},
      therapies:["factor"]
    },
    { id:"new-3-ortho-aspirin", svg:"graphs/Platelet_blockers.svg", condition:"Abnormal platelet function / antiplatelet agent",
      description:"After orthopedic surgery, generalized oozing is noted from suture lines. The patient has a history of coronary artery disease. Temperature and acid-base status are normal. A viscoelastic test is performed.",
      teg:{R:8, K:1.9, alpha:58, MA:38, LY30:1},
      rotem:{CT:72, CFT:150, alpha:62, MCF:36, LI30:98},
      therapies:["platelets"]
    },
    { id:"new-4-esld", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"A patient with end-stage liver disease develops slow mucosal bleeding post-procedure. Despite correction of temperature and electrolytes, the surgical field remains wet. A viscoelastic test is obtained.",
      teg:{R:18, K:2.4, alpha:55, MA:59, LY30:1},
      rotem:{CT:165, CFT:170, alpha:58, MCF:59, LI30:98},
      therapies:["factor"]
    },
    { id:"new-5-cabg-postprotamine", svg:"graphs/Platelet_blockers.svg", condition:"Abnormal platelet function / antiplatelet agent",
      description:"After coronary artery bypass grafting, bleeding is noted from the chest drains. Protamine was recently administered at the appropriate dose. The surgical team orders viscoelastic analysis.",
      teg:{R:7, K:1.8, alpha:58, MA:39, LY30:1},

    },
    { id:"new-6-mtp-dilution", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"After massive transfusion for trauma, the patient remains hemodynamically stable but persistent oozing occurs at line sites. A viscoelastic test is performed to guide next products.",

    },
    { id:"new-9-dic-late", svg:"graphs/DIC_late.svg", condition:"DIC (late)",
      description:"A trauma patient develops new mucosal bleeding despite aggressive resuscitation.",
      teg:{R:20, K:4.8, alpha:36, MA:33, LY30:10},
      rotem:{CT:190, CFT:360, alpha:40, MCF:30, LI30:82},

    },
    { id:"new-10-pph-controlled", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",

      teg:{R:15, K:3.1, alpha:50, MA:56, LY30:1},
      rotem:{CT:140, CFT:230, alpha:55, MCF:54, LI30:98},
      therapies:["factor"]
    },
    { id:"new-11-trauma-lysis", svg:"graphs/fibrinolysis.svg", condition:"Fibrinolysis",
      description:"A trauma patient begins having increased chest tube output a few hours after stabilization.",
      teg:{R:8, K:2.1, alpha:60, MA:59, LY30:18},
      rotem:{CT:68, CFT:150, alpha:63, MCF:58, LI30:62},
      therapies:["txa"]
    },
    { id:"new-12-splenectomy-hyper", svg:"graphs/hypercoaguable.svg", condition:"Hypercoagulable state",
      description:"A patient undergoing splenectomy develops brisk clotting in the surgical field with minimal transfusion requirements.",
      teg:{R:4.2, K:0.8, alpha:79, MA:73, LY30:1},
      rotem:{CT:46, CFT:65, alpha:80, MCF:71, LI30:99},
      therapies:["none"]
    },
    { id:"new-13-dilution-crystalloids", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"During major abdominal surgery, the patient receives large volumes of crystalloids and exhibits slow oozing without major bleeding.",
      teg:{R:16, K:3.2, alpha:49, MA:57, LY30:1},
      rotem:{CT:150, CFT:240, alpha:55, MCF:55, LI30:98},
      therapies:["factor"]
    },
    { id:"new-14-ecmo-platelet", svg:"graphs/Platelet_blockers.svg", condition:"Abnormal platelet function / antiplatelet agent",
      description:"After prolonged mechanical support with an ECMO circuit, diffuse surface bleeding is observed. Hemodynamics and temperature are stable. A viscoelastic study is performed.",
      teg:{R:7.5, K:1.7, alpha:59, MA:34, LY30:2},
      rotem:{CT:70, CFT:140, alpha:61, MCF:32, LI30:97},
      therapies:["platelets"]
    },
    { id:"new-15-post-arrest-rewarm", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",

      rotem:{CT:155, CFT:170, alpha:59, MCF:60, LI30:98},

    },

      rotem:{CT:72, CFT:130, alpha:71, MCF:63, LI30:98},
      therapies:["none"]
    },
    { id:"new-17-normal-knee", svg:"graphs/Normal.svg", condition:"Normal",
      description:"Following uncomplicated knee arthroscopy, the operative field remains dry and line sites clot promptly. Vitals are stable and no active bleeding is observed.",
      teg:{R:8, K:1.7, alpha:64, MA:61, LY30:2},
      rotem:{CT:76, CFT:140, alpha:68, MCF:61, LI30:97},
      therapies:["none"]
    }

    /* ===== 17 NEW CASES END ===== */
  ];

  function buildOrderWithNormalFirst() {
    var normalIdx = [];
    for (var i=0;i<CASES.length;i++) if (CASES[i].condition === "Normal") normalIdx.push(i);
    var first = normalIdx[Math.floor(Math.random()*normalIdx.length)];
    var rest = [];
    for (var j=0;j<CASES.length;j++) if (j !== first) rest.push(j);
    rest = shuffled(rest);
    return [first].concat(rest);
  }

  var order = buildOrderWithNormalFirst();
  var ptr = 0;

  function render(){
    var main = document.getElementById("main");
    try {
      if(ptr >= order.length){
        main.innerHTML = `
          <div class="done">
            <h2>All ${CASES.length} scenarios completed 🎉</h2>
            <p>Final score: <b>${getScore().right}/${getScore().total}</b></p>
            <div class="row" style="margin-top:8px">
              <button class="btn" id="restartBtn">Restart (reshuffle)</button>
            </div>
          </div>`;
        document.getElementById("restartBtn").onclick = function(){
          order = buildOrderWithNormalFirst();
          ptr = 0; setScore(0,0); document.getElementById("score").textContent = "Score: 0/0"; render();
        };
        return;
      }

      var c = CASES[order[ptr]];
      var condButtons = CONDITIONS.map(function(n){ return `<button class="btn" data-cond="${n}">${n}</button>`; }).join('');
      var txButtons = Object.keys(THERAPIES).map(function(k){ return `<button class="btn" data-tx="${k}">${THERAPIES[k]}</button>`; }).join('');

      main.innerHTML = `
        <div class="grid">
          <div class="card">
            <div class="row" style="justify-content:space-between">
              <div>
                <div class="muted" style="text-transform:uppercase;font-size:12px">Case</div>
                <div class="title">Interpret this viscoelastic profile</div>
                <div class="muted" style="margin-top:2px">${c.description}</div>
              </div>
              <div class="row"><span class="pill">Progress ${ptr+1}/${CASES.length}</span></div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-top:12px">
              <div>
                <div class="muted" style="text-transform:uppercase;font-size:12px;margin-bottom:6px">Trace (SVG)</div>
                <div class="trace-wrap"><img id="trace" class="trace" alt="${c.id} viscoelastic trace" src="${c.svg}"></div>
                <div id="imgErr" class="error" style="display:none"></div>
              </div>

              <div>
                <div class="row"><button id="toggleParams" class="btn">Show parameters</button></div>
                <div id="params" class="params" style="display:none">
                  <div class="muted" style="margin-bottom:6px">TEG (min/deg/mm, %)</div>
                  <table>
                    <tr><th>R</th><th>K</th><th>α</th><th>MA</th><th>LY30</th></tr>
                    <tr><td>${c.teg.R}</td><td>${c.teg.K}</td><td>${c.teg.alpha}</td><td>${c.teg.MA}</td><td>${c.teg.LY30}</td></tr>
                  </table>
                  <div class="muted" style="margin:8px 0 6px">ROTEM (s/deg/mm, %)</div>
                  <table>
                    <tr><th>CT</th><th>CFT</th><th>α</th><th>MCF</th><th>LI30</th></tr>
                    <tr><td>${c.rotem.CT}</td><td>${c.rotem.CFT}</td><td>${c.rotem.alpha}</td><td>${c.rotem.MCF}</td><td>${c.rotem.LI30}</td></tr>
                  </table>
                </div>
              </div>
            </div>

            <div style="margin-top:12px">
              <div class="muted" style="text-transform:uppercase;font-size:12px;margin-bottom:6px">1) Which condition?</div>
              <div class="choices" id="condChoices">${condButtons}</div>

              <div class="muted" style="text-transform:uppercase;font-size:12px;margin:12px 0 6px">2) Select treatment(s)</div>
              <div class="choices" id="txChoices">${txButtons}</div>

              <div class="row" style="margin-top:10px">
                <button id="backBtn" class="btn">Back</button>
                <button id="checkBtn" class="btn">Check</button>
                <button id="nextBtn" class="btn primary">Next</button>
              </div>

              <div id="result" class="result" style="display:none"></div>
            </div>
          </div>

          <div class="card">
            <div class="row" style="justify-content:space-between">
              <div style="font-weight:700">Reference & Notes</div>
              <button id="toggleNotes" class="btn">Hide</button>
            </div>
            <div id="notesBox" style="display:block;margin-top:8px">
              <div style="font-weight:700;margin:6px 0 4px">Normal values (simplified)</div>
              <table style="margin-bottom:8px">
                <tr><th colspan="5" style="text-align:left">TEG</th></tr>
                <tr><th>R (min)</th><th>K (min)</th><th>α (deg)</th><th>MA (mm)</th><th>LY30 (%)</th></tr>
                <tr>
                  <td>${NORMALS.TEG.R[0]}–${NORMALS.TEG.R[1]}</td>
                  <td>${NORMALS.TEG.K[0]}–${NORMALS.TEG.K[1]}</td>
                  <td>${NORMALS.TEG.alpha[0]}–${NORMALS.TEG.alpha[1]}</td>
                  <td>${NORMALS.TEG.MA[0]}–${NORMALS.TEG.MA[1]}</td>
                  <td>${NORMALS.TEG.LY30[0]}–${NORMALS.TEG.LY30[1]}</td>
                </tr>
              </table>
              <table>
                <tr><th colspan="5" style="text-align:left">ROTEM</th></tr>
                <tr><th>CT (s)</th><th>CFT (s)</th><th>α (deg)</th><th>MCF (mm)</th><th>LI30 (%)</th></tr>
                <tr>
                  <td>${NORMALS.ROTEM.CT[0]}–${NORMALS.ROTEM.CT[1]}</td>
                  <td>${NORMALS.ROTEM.CFT[0]}–${NORMALS.ROTEM.CFT[1]}</td>
                  <td>${NORMALS.ROTEM.alpha[0]}–${NORMALS.ROTEM.alpha[1]}</td>
                  <td>${NORMALS.ROTEM.MCF[0]}–${NORMALS.ROTEM.MCF[1]}</td>
                  <td>${NORMALS.ROTEM.LI30[0]}–${NORMALS.ROTEM.LI30[1]}</td>
                </tr>
              </table>
              <ul class="muted" style="margin:10px 0 0 18px;line-height:1.4">
                <li><b>R/CT ↑</b> or <b>K/CFT ↑</b> or <b>α ↓</b> → <b>Factor Replacement (Plasma and/or Cryo)</b>.</li>
                <li><b>MA/MCF ↓</b> → Platelets.</li>
                <li><b>LY30 ↑ / LI30 ↓</b> → Consider antifibrinolytic (TXA) when appropriate.</li>
              </ul>
              <div class="muted" style="margin-top:10px;font-size:12px">Educational tool only; not for clinical decision-making.</div>
            </div>
          </div>
        </div>`;

      /* ---------- IMG handling: force reload + play re-entry animation ---------- */
      var img = document.getElementById("trace");

      // Ensure a fresh load even if the same filename is reused
      var cacheBust = "case=" + encodeURIComponent(c.id) + "&t=" + Date.now();
      img.classList.remove('show');         // reset animation state
      img.removeAttribute('src');           // force change even if URL is same
      img.src = c.svg + (c.svg.includes("?") ? "&" : "?") + cacheBust;

      img.onload = function(){
        // Restart CSS animation each time
        img.classList.remove('show');
        void img.offsetWidth;               // reflow to restart animation
        img.classList.add('show');
      };

      img.onerror = function(){
        var e = document.getElementById("imgErr");
        e.style.display = "block";
        e.textContent = "Could not load " + img.src + ". Check filename and graphs/ folder.";
      };

      document.getElementById("toggleParams").onclick = function(){
        var pane = document.getElementById("params");
        var open = pane.style.display !== "none";
        pane.style.display = open ? "none" : "block";
        this.textContent = open ? "Show parameters" : "Hide parameters";
      };
      document.getElementById("toggleNotes").onclick = function(){
        var box = document.getElementById("notesBox");
        var open = box.style.display !== "none";
        box.style.display = open ? "none" : "block";
        this.textContent = open ? "Show" : "Hide";
      };

      var backBtn = document.getElementById("backBtn");
      backBtn.disabled = (ptr === 0);
      backBtn.onclick = function(){ if(ptr>0){ ptr--; render(); } };
      document.getElementById("nextBtn").onclick = function(){ ptr++; render(); };
      document.getElementById("checkBtn").onclick = function(){ check(c); };

      Array.prototype.forEach.call(document.getElementById("condChoices").children, function(btn){
        btn.setAttribute('aria-pressed', 'false');
        btn.addEventListener("click", function(){
          Array.prototype.forEach.call(document.getElementById("condChoices").children, function(b){
            b.classList.remove("selected");
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add("selected");
          btn.setAttribute('aria-pressed', 'true');
        });
      });
      Array.prototype.forEach.call(document.getElementById("txChoices").children, function(btn){
        btn.setAttribute('aria-pressed', 'false');
        btn.addEventListener("click", function(){
          var isSelected = btn.classList.toggle("selected");
          btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
        });
      });

    } catch (err) {
      var main = document.getElementById("main");
      main.innerHTML = `
        <div class="error">
          <div style="font-weight:700">Render error</div>
          <div>${(err && err.message) ? err.message : String(err)}</div>
          <pre style="white-space:pre-wrap;margin-top:8px">${(err && err.stack) ? err.stack : ''}</pre>
        </div>`;
      console.error(err);
    }
  }

  function getScore(){
    var sEl = document.getElementById("score");
    var m = sEl.textContent.match(/(\d+)\/(\d+)/);
    return m ? {right:parseInt(m[1],10), total:parseInt(m[2],10)} : {right:0,total:0};
  }
  function setScore(r,t){ document.getElementById("score").textContent = "Score: " + r + "/" + t; }

  function check(c){
    var chosenCondBtn = document.querySelector('#condChoices .btn.selected');
    var chosenCond = chosenCondBtn ? chosenCondBtn.getAttribute('data-cond') : null;
    var chosenTx = Array.prototype.map.call(
      document.querySelectorAll('#txChoices .btn.selected'),
      function(b){ return b.getAttribute('data-tx'); }
    ).sort();
    var requiredTx = c.therapies.slice().sort();

    var condOK = (chosenCond === c.condition);
    var txOK = JSON.stringify(chosenTx) === JSON.stringify(requiredTx);

    var sc = getScore();
    sc.total += 1; if(condOK && txOK) sc.right += 1; setScore(sc.right, sc.total);

    var box = document.getElementById("result");
    box.style.display = "block";
    box.className = "result " + (condOK && txOK ? "" : "bad");
    box.innerHTML =
      `<div><b>Condition:</b> ${condOK ? "✅ correct" : "❌ expected “" + c.condition + "”"}</div>
       <div><b>Treatment:</b> ${txOK ? "✅ correct" : "❌ expected " + c.therapies.map(function(k){return THERAPIES[k];}).join(", ")}</div>`;
  }

  document.addEventListener("DOMContentLoaded", function(){ render(); });
})();
</script>
</body>
</html>
