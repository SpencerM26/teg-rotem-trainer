<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEG/ROTEM Interpretation Practice</title>
<style>
  :root { --bg:#0b0c10; --panel:#12141b; --ink:#e7ebf2; --muted:#98a2b3; --accent:#67e8f9; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .header{display:flex;justify-content:space-between;align-items:center;background:#0f1117;border:1px solid #1f2531;border-radius:16px;padding:14px 16px}
  h1{font-size:18px;margin:0}
  .score{font-weight:700}
  .card{background:var(--panel);border:1px solid #1f2531;border-radius:16px;padding:16px}
  .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  .muted{color:var(--muted)}
  .title{font-weight:800;font-size:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;cursor:pointer;border-radius:12px;padding:10px 12px;border:1px solid #2b3446;background:#0f1320;color:var(--ink)}
  .btn:hover{border-color:#3a4a61}
  .btn.primary{background:#1b2437;border-color:#32415a}
  .btn.selected{background:var(--accent);color:#0a0f12;border-color:var(--accent)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .trace-wrap{background:#ffffff;border-radius:12px;border:1px solid #2a3140;padding:8px}
  img.trace{display:block;width:100%;height:auto;background:#ffffff;border-radius:8px}
  .params{margin-top:8px;border-top:1px dashed #2a3140;padding-top:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:6px 8px;border-bottom:1px solid #212838;text-align:left}
  .pill{background:#16212f;border:1px solid #273143;color:var(--muted);padding:4px 8px;border-radius:999px;font-size:12px}
  .result{margin-top:10px;padding:12px;border-radius:12px;background:#0d2019;border:1px solid #1a3b2f;color:#bfffe1}
  .result.bad{background:#2a1717;border:1px solid #4d2323;color:#ffd5d5}
  .error{margin-top:10px;padding:10px;border-radius:10px;background:#2a1717;border:1px solid #4d2323;color:#ffd5d5}
  .done{padding:16px;border-radius:14px;background:#11221a;border:1px solid #1f3c2e}
  @media (max-width:920px){ .grid{grid-template-columns:1fr} .choices{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>TEG/ROTEM Interpretation Practice</h1>
      <div id="score" class="score">Score: 0/0</div>
    </div>
    <div id="main" style="margin-top:16px"></div>
  </div>

<script>
(function(){
  // helpers
  function $(sel){ return document.querySelector(sel); }
  function shuffled(a){ var x=a.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; } return x; }

  // conditions
  var CONDITIONS = [
    "Normal",
    "Anticoagulants / Factor deficiency",
    "Abnormal platelet function / antiplatelet agent",
    "Fibrinolysis",
    "Hypercoagulable state",
    "DIC (late)"
  ];

  // therapies (combine plasma + cryo into one)
  var THERAPIES = {
    factor: "Factor Replacement (Plasma and/or Cryo)",
    platelets: "Platelets",
    txa: "TXA / antifibrinolytic",
    none: "No product"
  };

  var NORMALS = {
    TEG: { R:[5,10], K:[1,3], alpha:[53,72], MA:[50,70], LY30:[0,3] },
    ROTEM:{ CT:[38,79], CFT:[34,159], alpha:[65,83], MCF:[50,72], LI30:[94,100] }
  };

  // scenarios (texts preserved; therapies updated to use "factor" where plasma/cryo were used)
  var CASES = [
    // 1 Normal
    { id:"normal-1", svg:"graphs/Normal.svg", condition:"Normal",
      description:"A middle-aged post-operative patient is recovering uneventfully. The surgical field remains dry, vital signs are stable, and temperature and perfusion are normal. A viscoelastic test is performed.",
      teg:{R:7, K:1.5, alpha:65, MA:62, LY30:1},
      rotem:{CT:70, CFT:120, alpha:70, MCF:62, LI30:98},
      therapies:["none"]
    },
    // 2 Normal
    { id:"normal-2", svg:"graphs/Normal.svg", condition:"Normal",
      description:"Following trauma surgery, hemostasis appears secure and blood loss has stopped. The patient is normothermic and stable on room air. The team performs a viscoelastic study.",
      teg:{R:8, K:1.8, alpha:63, MA:60, LY30:2},
      rotem:{CT:75, CFT:140, alpha:68, MCF:60, LI30:97},
      therapies:["none"]
    },
    // 3 Factor deficiency → Factor Replacement
    { id:"anticoag-1", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"After cardiothoracic surgery, mild oozing persists from multiple small sites. The patient has been rewarmed and electrolytes corrected. Anesthetic recovery is uneventful, but clinicians obtain a viscoelastic trace to assess early clot initiation and kinetics before giving additional products.",
      teg:{R:16, K:2.5, alpha:58, MA:62, LY30:1},
      rotem:{CT:140, CFT:150, alpha:60, MCF:62, LI30:98},
      therapies:["factor"]
    },
    // 4 New factor deficiency → Factor Replacement
    { id:"anticoag-3", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"A patient with liver disease develops diffuse bleeding following abdominal surgery. Bleeding is not brisk but persists despite surgical hemostasis. A viscoelastic analysis is ordered.",
      teg:{R:18, K:2.2, alpha:56, MA:60, LY30:1},
      rotem:{CT:160, CFT:145, alpha:58, MCF:60, LI30:98},
      therapies:["factor"]
    },
    // 5 Fibrinogen deficit (now uses combined Factor Replacement)
    { id:"fibrino-1", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"In a major abdominal procedure with moderate transfusion requirement, the operative field shows slow ooze from broad tissue planes. Core temperature and acid–base status are acceptable. A viscoelastic study is performed to examine clot propagation and firmness.",
      teg:{R:8, K:3.5, alpha:48, MA:56, LY30:2},
      rotem:{CT:80, CFT:260, alpha:54, MCF:54, LI30:97},
      therapies:["factor"]
    },
    // 6 Fibrinogen deficit (now uses combined Factor Replacement)
    { id:"fibrino-2", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"A postpartum hemorrhage has been controlled surgically, but small diffuse bleeding continues. Blood pressure and temperature are stable. Clinicians request a viscoelastic test to evaluate the quality of hemostasis.",
      teg:{R:7, K:3.2, alpha:50, MA:52, LY30:1},
      rotem:{CT:78, CFT:240, alpha:56, MCF:52, LI30:98},
      therapies:["factor"]
    },
    // 7 Platelets (antiplatelet)
    { id:"plate-1", svg:"graphs/Platelet_blockers.svg", condition:"Abnormal platelet function / antiplatelet agent",
      description:"An urgent non-cardiac operation proceeds in a patient with MI and stent placement 5 months ago. There is generalized oozing. After correction of temperature and electrolytes, a viscoelastic study is obtained to evaluate overall clot strength.",
      teg:{R:8, K:2, alpha:55, MA:40, LY30:1},
      rotem:{CT:75, CFT:160, alpha:60, MCF:38, LI30:98},
      therapies:["platelets"]
    },
    // 8 Platelets
    { id:"plate-2", svg:"graphs/Platelet_blockers.svg", condition:"Abnormal platelet function / antiplatelet agent",
      description:"A complex hepatic resection becomes notable for diffuse surface bleeding that is unresponsive to surgical measures. The anesthesia team performs a viscoelastic assay.",
      teg:{R:7, K:1.8, alpha:60, MA:36, LY30:2},
      rotem:{CT:70, CFT:150, alpha:62, MCF:34, LI30:97},
      therapies:["platelets"]
    },
    // 9 TXA
    { id:"lysis-1", svg:"graphs/fibrinolysis.svg", condition:"Fibrinolysis",
      description:"Following initial control of major trauma bleeding, re-accumulation of blood occurs at line sites and drains. Laboratory studies are pending. A viscoelastic test is requested.",
      teg:{R:8, K:2, alpha:60, MA:62, LY30:14},
      rotem:{CT:70, CFT:140, alpha:65, MCF:62, LI30:60},
      therapies:["txa"]
    },
    // 10 TXA
    { id:"lysis-2", svg:"graphs/fibrinolysis.svg", condition:"Fibrinolysis",
      description:"In elective orthopedic surgery, steady drain output persists despite good hemostasis and stable vitals. The surgeon suspects fragile clot formation. A viscoelastic profile is performed.",
      teg:{R:8, K:2, alpha:60, MA:58, LY30:10},
      rotem:{CT:70, CFT:150, alpha:63, MCF:58, LI30:70},
      therapies:["txa"]
    },
    // 11 Hypercoagulable
    { id:"hyper-1", svg:"graphs/hypercoaguable.svg", condition:"Hypercoagulable state",
      description:"During minimally invasive colectomy, suction canister tubing begins to occlude with rapidly forming clot even though bleeding is minimal. Clinicians request a viscoelastic test.",
      teg:{R:4, K:0.8, alpha:78, MA:74, LY30:1},
      rotem:{CT:45, CFT:60, alpha:80, MCF:72, LI30:98},
      therapies:["none"]
    },
    // 12 Hypercoagulable
    { id:"hyper-2", svg:"graphs/hypercoaguable.svg", condition:"Hypercoagulable state",
      description:"After blunt trauma, hemostasis is brisk and all line sites clot immediately. The field is dry and transfusion needs are minimal. A viscoelastic trace is obtained to study overall coagulation.",
      teg:{R:5, K:1, alpha:75, MA:70, LY30:1},
      rotem:{CT:50, CFT:80, alpha:78, MCF:68, LI30:99},
      therapies:["none"]
    },
    // 13 DIC (late) → Factor Replacement + Platelets
    { id:"dicL-1", svg:"graphs/DIC_late.svg", condition:"DIC (late)",
      description:"In a patient with septic shock, ongoing mucosal and line-site bleeding develops despite supportive care. Vital signs stabilize with resuscitation, but the team notes ongoing bleeding. A viscoelastic test is performed.",
      teg:{R:18, K:5, alpha:35, MA:34, LY30:8},
      rotem:{CT:180, CFT:380, alpha:38, MCF:32, LI30:85},
      therapies:["factor","platelets"]
    },
    // 14 Factor Replacement (new)
    { id:"plasma-new", svg:"graphs/anticoagulant_factor_deficiency.svg", condition:"Anticoagulants / Factor deficiency",
      description:"During major transfusion for abdominal trauma, persistent oozing occurs despite adequate temperature and calcium correction. The clinical team performs viscoelastic testing.",
      teg:{R:17, K:2.3, alpha:58, MA:63, LY30:1},
      rotem:{CT:150, CFT:155, alpha:60, MCF:61, LI30:98},
      therapies:["factor"]
    },
    // 15 Platelets (new)
    { id:"plate-3", svg:"graphs/Platelet_blockers.svg", condition:"Abnormal platelet function / antiplatelet agent",
      description:"After prolonged bypass support, diffuse oozing is noted from line sites and incisions. Laboratory tests are inconclusive. The perfusionist requests viscoelastic analysis.",
      teg:{R:7, K:1.6, alpha:60, MA:35, LY30:2},
      rotem:{CT:68, CFT:145, alpha:61, MCF:33, LI30:97},
      therapies:["platelets"]
    }
  ];

  // state
  var order = shuffled(CASES.map(function(_,i){ return i; }));
  var ptr = 0;

  function render(){
    var main = document.getElementById("main");
    try {
      if(ptr >= order.length){
        main.innerHTML = `
          <div class="done">
            <h2>All ${CASES.length} scenarios completed 🎉</h2>
            <p>Final score: <b>${getScore().right}/${getScore().total}</b></p>
            <div class="row" style="margin-top:8px">
              <button class="btn" id="restartBtn">Restart (reshuffle)</button>
            </div>
          </div>`;
        document.getElementById("restartBtn").onclick = function(){
          order = shuffled(CASES.map(function(_,i){ return i; }));
          ptr = 0; setScore(0,0); document.getElementById("score").textContent = "Score: 0/0"; render();
        };
        return;
      }

      var c = CASES[order[ptr]];
      var condButtons = CONDITIONS.map(function(n){ return `<button class="btn" data-cond="${n}">${n}</button>`; }).join('');
      var txButtons = Object.keys(THERAPIES).map(function(k){ return `<button class="btn" data-tx="${k}">${THERAPIES[k]}</button>`; }).join('');

      main.innerHTML = `
        <div class="grid">
          <div class="card">
            <div class="row" style="justify-content:space-between">
              <div>
                <div class="muted" style="text-transform:uppercase;font-size:12px">Case</div>
                <div class="title">Interpret this viscoelastic profile</div>
                <div class="muted" style="margin-top:2px">${c.description}</div>
              </div>
              <div class="row"><span class="pill">Progress ${ptr+1}/${CASES.length}</span></div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-top:12px">
              <div>
                <div class="muted" style="text-transform:uppercase;font-size:12px;margin-bottom:6px">Trace (SVG)</div>
                <div class="trace-wrap"><img id="trace" class="trace" alt="${c.id} viscoelastic trace" src="${c.svg}"></div>
                <div id="imgErr" class="error" style="display:none"></div>
              </div>

              <div>
                <div class="row"><button id="toggleParams" class="btn">Show parameters</button></div>
                <div id="params" class="params" style="display:none">
                  <div class="muted" style="margin-bottom:6px">TEG (min/deg/mm, %)</div>
                  <table>
                    <tr><th>R</th><th>K</th><th>α</th><th>MA</th><th>LY30</th></tr>
                    <tr><td>${c.teg.R}</td><td>${c.teg.K}</td><td>${c.teg.alpha}</td><td>${c.teg.MA}</td><td>${c.teg.LY30}</td></tr>
                  </table>
                  <div class="muted" style="margin:8px 0 6px">ROTEM (s/deg/mm, %)</div>
                  <table>
                    <tr><th>CT</th><th>CFT</th><th>α</th><th>MCF</th><th>LI30</th></tr>
                    <tr><td>${c.rotem.CT}</td><td>${c.rotem.CFT}</td><td>${c.rotem.alpha}</td><td>${c.rotem.MCF}</td><td>${c.rotem.LI30}</td></tr>
                  </table>
                </div>
              </div>
            </div>

            <div style="margin-top:12px">
              <div class="muted" style="text-transform:uppercase;font-size:12px;margin-bottom:6px">1) Which condition?</div>
              <div class="choices" id="condChoices">${condButtons}</div>

              <div class="muted" style="text-transform:uppercase;font-size:12px;margin:12px 0 6px">2) Select treatment(s)</div>
              <div class="choices" id="txChoices">${txButtons}</div>

              <div class="row" style="margin-top:10px">
                <button id="backBtn" class="btn">Back</button>
                <button id="checkBtn" class="btn">Check</button>
                <button id="nextBtn" class="btn primary">Next</button>
              </div>

              <div id="result" class="result" style="display:none"></div>
            </div>
          </div>

          <div class="card">
            <div class="row" style="justify-content:space-between">
              <div style="font-weight:700">Reference & Notes</div>
              <button id="toggleNotes" class="btn">Hide</button>
            </div>
            <div id="notesBox" style="display:block;margin-top:8px">
              <div style="font-weight:700;margin:6px 0 4px">Normal values (simplified)</div>
              <table style="margin-bottom:8px">
                <tr><th colspan="5" style="text-align:left">TEG</th></tr>
                <tr><th>R (min)</th><th>K (min)</th><th>α (deg)</th><th>MA (mm)</th><th>LY30 (%)</th></tr>
                <tr>
                  <td>${NORMALS.TEG.R[0]}–${NORMALS.TEG.R[1]}</td>
                  <td>${NORMALS.TEG.K[0]}–${NORMALS.TEG.K[1]}</td>
                  <td>${NORMALS.TEG.alpha[0]}–${NORMALS.TEG.alpha[1]}</td>
                  <td>${NORMALS.TEG.MA[0]}–${NORMALS.TEG.MA[1]}</td>
                  <td>${NORMALS.TEG.LY30[0]}–${NORMALS.TEG.LY30[1]}</td>
                </tr>
              </table>
              <table>
                <tr><th colspan="5" style="text-align:left">ROTEM</th></tr>
                <tr><th>CT (s)</th><th>CFT (s)</th><th>α (deg)</th><th>MCF (mm)</th><th>LI30 (%)</th></tr>
                <tr>
                  <td>${NORMALS.ROTEM.CT[0]}–${NORMALS.ROTEM.CT[1]}</td>
                  <td>${NORMALS.ROTEM.CFT[0]}–${NORMALS.ROTEM.CFT[1]}</td>
                  <td>${NORMALS.ROTEM.alpha[0]}–${NORMALS.ROTEM.alpha[1]}</td>
                  <td>${NORMALS.ROTEM.MCF[0]}–${NORMALS.ROTEM.MCF[1]}</td>
                  <td>${NORMALS.ROTEM.LI30[0]}–${NORMALS.ROTEM.LI30[1]}</td>
                </tr>
              </table>
              <ul class="muted" style="margin:10px 0 0 18px;line-height:1.4">
                <li><b>R/CT ↑</b> or <b>K/CFT ↑</b> or <b>α ↓</b> → <b>Factor Replacement (Plasma and/or Cryo)</b>.</li>
                <li><b>MA/MCF ↓</b> → Platelets.</li>
                <li><b>LY30 ↑ / LI30 ↓</b> → Consider antifibrinolytic (TXA) when appropriate.</li>
              </ul>
              <div class="muted" style="margin-top:10px;font-size:12px">Educational tool only; not for clinical decision-making.</div>
            </div>
          </div>
        </div>`;

      // image error
      var img = document.getElementById("trace");
      img.onerror = function(){
        var e = document.getElementById("imgErr");
        e.style.display = "block";
        e.textContent = "Could not load " + c.svg + ". Check filename and graphs/ folder.";
      };

      // toggles
      document.getElementById("toggleParams").onclick = function(){
        var pane = document.getElementById("params");
        var open = pane.style.display !== "none";
        pane.style.display = open ? "none" : "block";
        this.textContent = open ? "Show parameters" : "Hide parameters";
      };
      document.getElementById("toggleNotes").onclick = function(){
        var box = document.getElementById("notesBox");
        var open = box.style.display !== "none";
        box.style.display = open ? "none" : "block";
        this.textContent = open ? "Show" : "Hide";
      };

      // back/next/check
      var backBtn = document.getElementById("backBtn");
      backBtn.disabled = (ptr === 0);
      backBtn.onclick = function(){ if(ptr>0){ ptr--; render(); } };
      document.getElementById("nextBtn").onclick = function(){ ptr++; render(); };
      document.getElementById("checkBtn").onclick = function(){ check(c); };

      // answer selection
      Array.prototype.forEach.call(document.getElementById("condChoices").children, function(btn){
        btn.setAttribute('aria-pressed', 'false');
        btn.addEventListener("click", function(){
          Array.prototype.forEach.call(document.getElementById("condChoices").children, function(b){
            b.classList.remove("selected");
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add("selected");
          btn.setAttribute('aria-pressed', 'true');
        });
      });
      Array.prototype.forEach.call(document.getElementById("txChoices").children, function(btn){
        btn.setAttribute('aria-pressed', 'false');
        btn.addEventListener("click", function(){
          var isSelected = btn.classList.toggle("selected");
          btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
        });
      });

    } catch (err) {
      var main = document.getElementById("main");
      main.innerHTML = `
        <div class="error">
          <div style="font-weight:700">Render error</div>
          <div>${(err && err.message) ? err.message : String(err)}</div>
          <pre style="white-space:pre-wrap;margin-top:8px">${(err && err.stack) ? err.stack : ''}</pre>
        </div>`;
      console.error(err);
    }
  } // end render

  function getScore(){
    var sEl = document.getElementById("score");
    var m = sEl.textContent.match(/(\d+)\/(\d+)/);
    return m ? {right:parseInt(m[1],10), total:parseInt(m[2],10)} : {right:0,total:0};
  }
  function setScore(r,t){ document.getElementById("score").textContent = "Score: " + r + "/" + t; }

  function check(c){
    var chosenCondBtn = document.querySelector('#condChoices .btn.selected');
    var chosenCond = chosenCondBtn ? chosenCondBtn.getAttribute('data-cond') : null;
    var chosenTx = Array.prototype.map.call(
      document.querySelectorAll('#txChoices .btn.selected'),
      function(b){ return b.getAttribute('data-tx'); }
    ).sort();
    var requiredTx = c.therapies.slice().sort();

    var condOK = (chosenCond === c.condition);
    var txOK = JSON.stringify(chosenTx) === JSON.stringify(requiredTx);

    var sc = getScore();
    sc.total += 1; if(condOK && txOK) sc.right += 1; setScore(sc.right, sc.total);

    var box = document.getElementById("result");
    box.style.display = "block";
    box.className = "result " + (condOK && txOK ? "" : "bad");
    box.innerHTML =
      `<div><b>Condition:</b> ${condOK ? "✅ correct" : "❌ expected “" + c.condition + "”"}</div>
       <div><b>Treatment:</b> ${txOK ? "✅ correct" : "❌ expected " + c.therapies.map(function(k){return THERAPIES[k];}).join(", ")}</div>`;
  }

  // boot
  document.addEventListener("DOMContentLoaded", function(){ render(); });
})();
</script>
</body>
</html>
