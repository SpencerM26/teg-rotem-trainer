<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viscoelastic Testing Practice</title>
<style>
  :root {
    --bg: #F5F2EF;
    --panel: #ffffff;
    --ink: #202020;
    --muted: #5a5a5a;
    --accent: #c22d2d;
    --accent2: #007b7b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border: 1px solid #ddd;
    border-radius: 16px;
    padding: 14px 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  .header h1 {
    font-size: 22px;
    margin: 0;
    color: var(--ink);
  }

  .logo {
    height: 56px;
    width: auto;
  }

  .score {
    font-weight: 700;
    color: var(--accent2);
  }

  .card {
    background: var(--panel);
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .grid {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 16px;
  }

  .muted { color: var(--muted); }
  .title { font-weight: 800; font-size: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .btn {
    appearance: none;
    cursor: pointer;
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid #ccc;
    background: #f7f7f7;
    color: var(--ink);
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }

  .btn:hover { background: #e8e8e8; border-color: #aaa; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.selected { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  .choices {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .trace-wrap {
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #ccc;
    padding: 8px;
  }

  img.trace { display: block; width: 100%; height: auto; background: #ffffff; border-radius: 8px; }

  .params { margin-top: 8px; border-top: 1px dashed #ccc; padding-top: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #ddd; text-align: left; }

  .pill {
    background: #eaeaea;
    border: 1px solid #d5d5d5;
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 12px;
  }

  .result {
    margin-top: 10px;
    padding: 12px;
    border-radius: 12px;
    background: #e8f6ee;
    border: 1px solid #b6e0c1;
    color: #2b5e36;
  }

  .result.bad {
    background: #fae9e9;
    border: 1px solid #d38c8c;
    color: #902b2b;
  }

  .error {
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    background: #fae9e9;
    border: 1px solid #d38c8c;
    color: #902b2b;
  }

  .done {
    padding: 16px;
    border-radius: 14px;
    background: #eef6f4;
    border: 1px solid #d5e7e3;
  }

  @media (max-width: 920px) {
    .grid { grid-template-columns: 1fr; }
    .choices { grid-template-columns: 1fr 1fr; }
    .header h1 { font-size: 18px; }
    .logo { height: 44px; }
  }
</style>
</head>
<body>
  <div class="wrap">

        <h1>Viscoelastic Testing Practice</h1>
      </div>
      <div id="score" class="score">Score: 0/0</div>

</body>
</html>
